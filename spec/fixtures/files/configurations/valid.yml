# result path
# default "mermaid_erd/index.html"
result_path: doc/erd.html

# Exclude tables whose names match any of the following regular expressions.
ignore_tables:
  - "\\Aaudit_"
  - "\\Aschema_migrations\\z"

# The view the viewer opens on.
viewer_defaults:
  models:
    - User
    - Post
  columns: keys
