name: audit

# A new advisory can appear without any change to this repository, so besides
# pull requests that touch a lock file and pushes, this runs every week; a
# failing scheduled run is how a freshly published advisory reaches us.
#
# bundler-audit checks Gemfile.lock against ruby-advisory-db. npm audit checks
# the lock file of the Tailwind build tool (script/tailwind), which is not
# shipped in the gem, and fails from "high" up.

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "Gemfile.lock"
      - "script/tailwind/package-lock.json"
      - ".github/workflows/audit.yml"
  push:
    branches:
      - main
      - develop
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundler-audit:
    name: Bundler advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"

      - name: Install bundler-audit
        run: gem install bundler-audit --no-document

      - name: Audit Gemfile.lock
        run: bundle-audit check --update

  npm-audit:
    name: npm advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: script/tailwind
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # tailwindcss 3.x pulls in chokidar -> braces, and braces has no patched
      # release (GHSA-vfj7-8cjw-p6xm), so a plain `npm audit` cannot pass until
      # the build moves to Tailwind 4. That advisory is the only one skipped
      # here; any other high or critical advisory still fails the job.
      - name: Audit the Tailwind build dependencies
        run: |
          npm audit --package-lock-only --json > audit.json || true
          jq -r '
            [.vulnerabilities[].via[]
              | select(type == "object")
              | select(.severity == "high" or .severity == "critical")
              | select(.url != "https://github.com/advisories/GHSA-vfj7-8cjw-p6xm")
              | "\(.severity)  \(.name)  \(.title)  \(.url)"]
            | unique | .[]' audit.json > unexpected.txt
          cat unexpected.txt
          test ! -s unexpected.txt
