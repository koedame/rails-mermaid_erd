name: audit

# A new advisory can appear without any change to this repository, so besides
# pull requests that touch a lock file and pushes, this runs every week; a
# failing scheduled run is how a freshly published advisory reaches us.
#
# bundler-audit checks Gemfile.lock against ruby-advisory-db. npm audit checks
# the lock file of the Tailwind build tool (script/tailwind), which is not
# shipped in the gem, and fails from "high" up. The Mermaid and Vue bundles in
# lib/templates/vendor are plain files that neither of those sees, so
# script/audit_vendor.mjs audits the versions named in
# script/licenses/bundles.json, and fails from "moderate" up.

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "Gemfile.lock"
      - "script/tailwind/package-lock.json"
      - "script/licenses/bundles.json"
      - "script/audit_vendor.mjs"
      - "lib/templates/vendor/*.js"
      - ".github/workflows/audit.yml"
  push:
    branches:
      - main
      - develop
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundler-audit:
    name: Bundler advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.4"

      - name: Install bundler-audit
        run: gem install bundler-audit --no-document

      - name: Audit Gemfile.lock
        run: bundle-audit check --update

  npm-audit:
    name: npm advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: script/tailwind
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Audit the Tailwind build dependencies
        run: npm audit --package-lock-only --audit-level=high

  vendored-js-audit:
    name: Vendored JS advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Audit the bundled Mermaid and Vue
        run: node script/audit_vendor.mjs
