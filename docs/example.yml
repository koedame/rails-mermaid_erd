# result path
# default "mermaid_erd/index.html"
result_path: doc/erd.html

# Tables whose `table_name` matches any of the regular expressions below are
# excluded from the generated ERD, along with any relations that point at them.
# Patterns are compiled with `Regexp.new`, so escape backslashes (`\\A`, `\\z`)
# inside the YAML string. Tables that have no ActiveRecord model class are
# already absent from the diagram and don't need to be listed here. Default: [].
ignore_tables:
  - "\\Aaudit_"
  - "_legacy\\z"

# The view the viewer opens on when the URL carries no saved state, and the one
# Reset returns to. A link that carries its own state always wins.
viewer_defaults:
  # Models selected at first. A name that is not in the diagram is skipped with
  # a warning when the file is generated. Default: [] (nothing selected, which
  # keeps the first draw light on an app with hundreds of models).
  models:
    - User
    - Order
  # Columns each model draws: all, keys (primary and foreign keys only) or none.
  # Default: all.
  columns: keys
